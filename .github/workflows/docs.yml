name: Documentation

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'ccip-sdk/src/**'
      - 'ccip-cli/src/**'
      - 'ccip-api-ref/**'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches:
      - main
    paths:
      - 'ccip-sdk/src/**'
      - 'ccip-cli/src/**'
      - 'ccip-api-ref/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: 'npm'

      # node-hid (pulled transitively by the Ledger deps) ships no prebuilt
      # binary for node 24 on ubuntu-latest, so npm ci compiles it from source
      # and fails without libusb ("libusb.h: No such file or directory").
      - name: Install node-hid build dependencies
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev libudev-dev

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check -w ccip-api-ref

      - name: Generate API docs from OpenAPI spec
        run: npm run gen-api -w ccip-api-ref

      - name: Build documentation
        run: npm run build -w ccip-api-ref

      - name: Upload build artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: docs-build
          path: ccip-api-ref/build
          retention-days: 7
